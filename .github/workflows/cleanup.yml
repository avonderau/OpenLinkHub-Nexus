name: Clean up old runs and artifacts

# Frees GitHub Actions storage: deletes artifacts and finished workflow runs
# older than the given ages. Runs daily and can be started by hand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      artifact_days:
        description: Delete artifacts older than this many days (0 = all)
        default: "2"
      run_days:
        description: Delete finished workflow runs older than this many days
        default: "14"

permissions:
  actions: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.artifact_days || '2' }}
        run: |
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting artifacts created before $cutoff"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted artifact $id"
          done

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.run_days || '14' }}
          SELF: ${{ github.run_id }}
        run: |
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting completed runs created before $cutoff"
          gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100&created=<$cutoff" \
            --jq ".workflow_runs[] | select(.id != $SELF) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted run $id"
          done
